[databases]
synapse_mmo = host=postgres port=5432 dbname=synapse_mmo auth_user=synapse_user

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = synapse_user
stats_users = synapse_user

# Connection Pool Settings
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100
server_idle_timeout = 600
client_idle_timeout = 0
